# DistilBERT — fine-tuning configuration
# Owner: Dulanja. Model 4 of 4.
#
# Record the best configuration here after tuning on the VALIDATION set.
# Every value below is a starting point, not a final answer.

model:
  name: distilbert-base-uncased
  num_labels: 5
  # 6 transformer layers, 12 attention heads, hidden size 768.
  # ~66M parameters, of which ~66M are fine-tuned (no layers frozen).
  # Classification head: [CLS] -> pre_classifier (768) -> ReLU -> dropout
  # -> classifier (5).

data:
  max_len: 224          # p90 of training-set length is 194 words
  # DistilBERT's own WordPiece tokenizer is used, not our shared vocabulary.
  # Shared splits only: data/train.csv, val.csv, test.csv

training:
  batch_size: 16        # tuned: 16 beat 32 by 0.0011 macro F1
  lr: 5.0e-5            # tuned: peak of the 2e-5/3e-5/5e-5/8e-5 sweep
  epochs: 3             # pretrained models converge in 2-3; more overfits
  weight_decay: 0.01
  warmup_ratio: 0.1     # linear warmup then linear decay
  max_grad_norm: 1.0
  optimiser: AdamW
  loss: class-weighted cross-entropy
  early_stopping:
    monitor: val_f1_macro
    patience: 2
  mixed_precision: true # CUDA only; ignored on MPS and CPU

seeds: [42, 1, 2]

# --- tuning log -----------------------------------------------------------
# Fill this in as you go. The rubric wants evidence of a real search.
#
# | run | lr    | batch | max_len | epochs | val macro F1 | note            |
# |-----|-------|-------|---------|--------|--------------|-----------------|
# | 1   | 2e-5  | 32    | 224     | 3      | 0.8629       | baseline; val loss flat after ep2 |
# | 2   | 3e-5  | 32    | 224     | 3      | 0.8647       | best so far; val loss up at ep3 |
# | 3   | 5e-5  | 32    | 224     | 3      | 0.8670       | best F1, steepest overfit |
# | 4   | 8e-5  | 32    | 224     | 3      | 0.8648       | past the peak; worst val loss |
# | 5   | 5e-5  | 32    | 224     | 2      | 0.8664       | -0.0006 F1 for 34% less compute |
# | 6   | 5e-5  | 16    | 224     | 3      | 0.8681       | BEST; ep2 already 0.8681 |
# | 7   | -     | -     | -       | -      | -            | not needed; peak located |
#
# Spread across all six runs: 0.8629-0.8681 (0.0052). Seeds 1 and 2 will
# show whether this is larger than run-to-run variance.

# --- seed runs (lr 5e-5, batch 16, max_len 224, 3 epochs) ------------------
# | seed | val macro F1 |
# |------|--------------|
# | 42   | 0.8681       |
# | 1    | 0.8677       |
# | 2    | 0.8638       |
#
# mean 0.8665 +- 0.0024 (sd over 3 seeds)
#
# FINDING: seed-to-seed range is 0.0043, against a
# hyperparameter sweep range of 0.0052. Run-to-run variance is therefore
# 83% of the apparent tuning gain, so no configuration in
# the searched range is reliably better than another. Report the mean and
# sd, not the single best run.

results:
  best_val_f1: 0.8665   # mean over seeds 42/1/2, sd 0.0024
  test_f1_macro:
  train_time_min: 22.1   # T4, mixed precision
  params_millions: 66.4
